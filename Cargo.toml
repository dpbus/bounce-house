[package]
name = "bounce-house"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = "0.17.3"
hound = "3.5"
mp3lame-encoder = "0.2"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

ratatui = "0.29"
crossterm = "0.29"
ebur128 = "0.1.10"
palette = "0.7"
rand = "0.8"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
tempfile = "3"
